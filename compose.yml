services:
  backend:
    build: ./backend
    environment:
      DB_PATH: /data/reduce.db
    ports:
      - "8080:8080"
    platform: linux/amd64
    volumes:
      - ./data:/data
    networks:
      - docker

  frontend:
    build: ./frontend
    environment:
      PUBLIC_BACKEND_URL: http://localhost:8080
      INTERNAL_BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - docker

networks:
  docker:
    driver: bridge
